name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A closed PR only needs the preview removal, which the shared workflow does.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm --version

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint and check
        working-directory: app
        run: |
          npm run lint
          npm run check

      - name: Build
        working-directory: app
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}', github.event.number) || '' }}
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: app/build
          include-hidden-files: true

  pages:
    needs: build
    # `skipped` lets `closed` reach the removal.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: realJohnDoe/agent-skills/.github/workflows/pages.yml@main
    with:
      artifact: site
      previews: all
    permissions:
      contents: write
      pull-requests: write
