name: Deploy to GitHub Pages

on:
  push:
    branches: [main, try-node-v22]
  pull_request:
    branches: [main, try-node-v22]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm --version

      - name: Install
        working-directory: app
        run: npm install

      - name: Lint and check
        working-directory: app
        run: |
          npm run lint
          npm run check

      - name: Build
        working-directory: app
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: app/build
